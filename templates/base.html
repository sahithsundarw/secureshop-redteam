<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SecureShop{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('shop.home') }}">SecureShop</a>
    <nav>
      <a href="{{ url_for('shop.products') }}">Products</a>
      <form action="{{ url_for('shop.search') }}" method="get" class="inline">
        <input type="search" name="q" placeholder="Search products" aria-label="Search products">
        <button type="submit">Search</button>
      </form>
      {% if session.get('user_id') %}
        <form action="{{ url_for('auth.logout') }}" method="post" class="inline">
          <button type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Log in</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
