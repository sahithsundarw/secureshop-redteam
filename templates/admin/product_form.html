{% extends "base.html" %}
{% block title %}{{ 'Edit' if product and product.id else 'New' }} product - SecureShop{% endblock %}
{% block content %}
<h1>{{ 'Edit product' if product and product.id else 'New product' }}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <label>Name <input type="text" name="name" value="{{ product.name if product else '' }}" required></label>
  <label>Description <textarea name="description" required>{{ product.description if product else '' }}</textarea></label>
  <label>Price <input type="number" step="0.01" min="0" name="price" value="{{ product.price if product else '' }}" required></label>
  <label>Stock <input type="number" min="0" name="stock" value="{{ product.stock if product else '' }}" required></label>
  <button type="submit">Save</button>
  <a href="{{ url_for('admin.products') }}">Cancel</a>
</form>
{% endblock %}
